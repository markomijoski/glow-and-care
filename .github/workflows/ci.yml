# =============================================================================
#  CreamShop — GitHub Actions CI Pipeline
#  Trigger: push or pull request on main branch
#
#  Steps:
#    1. Checkout code
#    2. Run tests
#    3. Build Docker image
#    4. Push to DockerHub
# =============================================================================

name: Build Test & Push Docker Image

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:

  # ---------------------------------------------------------------------------
  # Job 1 — Run Django tests
  # ---------------------------------------------------------------------------
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB:       creamshop_test
          POSTGRES_USER:     creamshop_user
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U creamshop_user -d creamshop_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      SECRET_KEY:             test-secret-key-not-for-production
      DB_NAME:     creamshop_test
      DB_USER:     creamshop_user
      DB_PASSWORD: testpassword
      DB_HOST:     localhost
      DB_PORT:     5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run migrations
        run: python manage.py migrate --noinput

      - name: Run tests
        run: python manage.py test --verbosity=2

  # ---------------------------------------------------------------------------
  # Job 2 — Build and push Docker image to DockerHub
  # Only runs on push to main (not on pull requests)
  # ---------------------------------------------------------------------------
  build-and-push:
    name: Build & Push to DockerHub
    runs-on: ubuntu-latest
    needs: test                      # only runs if tests pass
    if: github.event_name == 'push'  # skip on pull requests

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/creamshop
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          dockerfile: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha      # GitHub Actions cache — speeds up builds
          cache-to:   type=gha,mode=max