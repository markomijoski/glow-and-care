<div class="empty-state text-center py-5">
    <div class="empty-state-icon mb-4">
        <i class="bi {{ icon|default:'bi-bag-dash' }} display-1 text-muted opacity-25"></i>
    </div>
    <h2 class="h4 fw-bold mb-2">{{ title|default:"Nothing here yet" }}</h2>
    <p class="text-muted mb-4 mx-auto" style="max-width: 400px;">
        {{ message|default:"Looks like this section is currently empty. Explore our collection and find your new favorites." }}
    </p>
    <div class="d-flex justify-content-center gap-3">
        <a href="{% url 'product_list' %}" class="btn btn-pink px-4 py-2 fw-bold rounded-pill">
            <i class="bi bi-shop me-2"></i>Start Shopping
        </a>
        {% if show_wishlist_btn %}
            <a href="{% url 'wishlist' %}" class="btn btn-outline-dark px-4 py-2 fw-bold rounded-pill">
                View Wishlist
            </a>
        {% endif %}
    </div>
</div>
