<div class="row g-3">
  {% for product in products %}
    <div class="col-md-6 col-xl-4">
      {% include 'creamapp/includes/product_card.html' with product=product %}
    </div>
  {% empty %}
    <div class="col-12">
      <div class="alert alert-light border mb-0">{{ empty_message }}</div>
    </div>
  {% endfor %}
</div>
