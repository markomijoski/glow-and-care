{% extends "creamapp/dashboard_base.html" %}

{% block dashboard_content %}
<div class="card gc-glass-card mb-4">
  <div class="card-body p-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h1 class="h4 fw-bold mb-0">Request Return for Order #{{ order.pk }}</h1>
      <a href="{% url 'order_detail' order.pk %}" class="btn btn-outline-secondary btn-sm">Cancel</a>
    </div>
    
    <div class="alert alert-info">
      <i class="bi bi-info-circle me-2"></i>
      Please tell us why you are returning this order. Our team will review your request and get back to you with shipping instructions.
    </div>
    
    <form method="POST">
      {% csrf_token %}
      <div class="mb-4">
        <label class="form-label fw-semibold">Reason for Return *</label>
        <textarea name="reason" class="form-control" rows="5" placeholder="Please provide details about why you are returning the items..." required></textarea>
      </div>
      
      <div class="d-flex justify-content-end">
        <button type="submit" class="btn btn-danger px-4">Submit Request</button>
      </div>
    </form>
    
  </div>
</div>
{% endblock %}
