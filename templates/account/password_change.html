{% extends "creamapp/dashboard_base.html" %}
{% load crispy_forms_tags %}

{% block title %}Change Password{% endblock %}

{% block dashboard_content %}
<div class="card gc-glass-card border-0 mb-4">
  <div class="card-body p-4">
    <h1 class="h4 fw-bold mb-4">Change Password</h1>
    
    <form method="POST" action="{% url 'account_change_password' %}" class="password_change">
      {% csrf_token %}
      {{ form|crispy }}
      
      <div class="mt-4 pt-3 border-top d-flex justify-content-end gap-2">
        <a href="{% url 'profile' %}" class="btn btn-outline-secondary me-auto">Cancel</a>
        <button type="submit" name="action" class="btn btn-pink px-4">Change Password</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
