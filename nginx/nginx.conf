# =============================================================================
#  CreamShop — Nginx Configuration
#  Acts as reverse proxy in front of Django/Gunicorn
# =============================================================================

upstream django {
    server web:8000;  # 'web' is the Django service name in docker-compose
}

server {
    listen 80;
    server_name localhost;

    client_max_body_size 20M;  # allow image uploads up to 20MB

    # ---------------------------------------------------------------------------
    # Static files — served directly by Nginx (fast)
    # ---------------------------------------------------------------------------
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
        alias /app/staticfiles/favicon.ico;
    }

    # ---------------------------------------------------------------------------
    # Media files — user uploads (product images, avatars)
    # ---------------------------------------------------------------------------
    location /media/ {
        alias /app/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location = /robots.txt {
        access_log off;
        alias /app/staticfiles/robots.txt;
    }

    # ---------------------------------------------------------------------------
    # All other requests — forward to Django/Gunicorn
    # ---------------------------------------------------------------------------
    location / {
        proxy_pass http://django;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 120;
        proxy_connect_timeout 120;
    }

    # Simple health endpoint for container healthchecks
    location = /health/ {
        access_log off;
        return 200 'OK';
        add_header Content-Type text/plain;
    }

    # Security headers
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header Referrer-Policy no-referrer-when-downgrade;
}